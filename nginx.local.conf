# Local development Nginx config for eksana.org
# No SSL, no caching — just clean URL rewrites on localhost:8080
#
# SETUP:
#   sudo cp nginx.local.conf /etc/nginx/sites-available/eksana-local
#   sudo ln -s /etc/nginx/sites-available/eksana-local /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then open: http://localhost:8080
#
# To stop: sudo rm /etc/nginx/sites-enabled/eksana-local && sudo systemctl reload nginx

server {
    listen 8080;
    server_name localhost;

    # Point this to your repo checkout
    root /home/autumn/coding/js/eksanawebsite;
    index index.html;

    # ── Redirect old /pages/ URLs to new clean URLs ─────────────────────────
    location ~ ^/pages/legal/(.+?)(?:\.html)?$ {
        return 301 /legal/$1;
    }
    location ~ ^/pages/blogs/(.+?)(?:\.html)?$ {
        return 301 /blog/$1;
    }
    location ~ ^/pages/blog(?:\.html)?$ {
        return 301 /blog;
    }
    location ~ ^/pages/(.+?)(?:\.html)?$ {
        return 301 /$1;
    }

    # ── Clean URLs ──────────────────────────────────────────────────────────
    # /blog → pages/blog.html
    location = /blog {
        try_files /pages/blog.html =404;
    }

    # /blog/post-name → pages/blogs/post-name.html
    location ~ ^/blog/(.+)$ {
        try_files /pages/blogs/$1.html =404;
    }

    # /legal/page-name → pages/legal/page-name.html
    location ~ ^/legal/(.+)$ {
        try_files /pages/legal/$1.html =404;
    }

    # /page-name → pages/page-name.html (for top-level pages)
    location / {
        try_files $uri $uri.html /pages/$uri.html $uri/ =404;
    }
}
