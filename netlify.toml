# Netlify configuration for eksana.org
# Clean URL rewrites: serves clean URLs without .html extension.
# URL structure: /page-name (not /pages/page-name)
# Blog posts: /blog/post-name

[build]
  publish = "."

# ── Redirect old /pages/ URLs to new clean URLs ────────────────────────────
# Legal pages: /pages/legal/xxx → /legal/xxx
[[redirects]]
  from = "/pages/legal/:page"
  to   = "/legal/:page"
  status = 301

# Blog posts: /pages/blogs/xxx → /blog/xxx
[[redirects]]
  from = "/pages/blogs/:page"
  to   = "/blog/:page"
  status = 301

# Other pages: /pages/xxx → /xxx
[[redirects]]
  from = "/pages/:page"
  to   = "/:page"
  status = 301

# ── Rewrite clean URLs → serve the actual .html files ──────────────────────
# Legal pages
[[redirects]]
  from = "/legal/:page"
  to   = "/pages/legal/:page.html"
  status = 200

# Blog posts: /blog/post-name → pages/blogs/post-name.html
[[redirects]]
  from = "/blog/:page"
  to   = "/pages/blogs/:page.html"
  status = 200

# Blog index
[[redirects]]
  from = "/blog"
  to   = "/pages/blog.html"
  status = 200

# Other pages: /page-name → pages/page-name.html
[[redirects]]
  from = "/free-tools"
  to   = "/pages/free-tools.html"
  status = 200

[[redirects]]
  from = "/how-to-use"
  to   = "/pages/how-to-use.html"
  status = 200

[[redirects]]
  from = "/team"
  to   = "/pages/team.html"
  status = 200

[[redirects]]
  from = "/contact"
  to   = "/pages/contact.html"
  status = 200
