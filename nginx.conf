# Nginx configuration for eksana.org
# Vultr VPS deployment — static site with clean URLs
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to /etc/nginx/sites-available/eksana.org
# 2. sudo ln -s /etc/nginx/sites-available/eksana.org /etc/nginx/sites-enabled/
# 3. Deploy site files to /var/www/eksana (see root directive below)
# 4. Run: sudo nginx -t && sudo systemctl reload nginx
# 5. Obtain SSL cert: sudo certbot --nginx -d eksana.org -d www.eksana.org
#    Certbot will automatically update this file with the SSL block.

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name eksana.org www.eksana.org;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://eksana.org$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eksana.org;

    # SSL certs — filled in by certbot; add manually if self-managing
    ssl_certificate     /etc/letsencrypt/live/eksana.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eksana.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eksana.org$request_uri;
}

# ── Main site (HTTPS, non-www) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eksana.org;

    # ── Document root ────────────────────────────────────────────────────────
    root  /var/www/eksana;
    index index.html;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/eksana.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eksana.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff2;

    # ── Clean URLs ───────────────────────────────────────────────────────────
    # Serves /pages/blog as /pages/blog.html (URL stays clean, no redirect)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ── Asset caching ────────────────────────────────────────────────────────
    # Fonts & images: cache for 1 year (content-addressed via filenames)
    location ~* \.(woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS & JS: cache for 1 week (re-validate if stale)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # dict.json (5700 legal terms) — cache for 1 day
    location = /data/dict.json {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Custom error pages ───────────────────────────────────────────────────
    error_page 404 /pages/404.html;

    # ── Deny access to internal directories ──────────────────────────────────
    location ~ ^/(docs|scripts|\.git) {
        deny all;
        return 404;
    }
}
